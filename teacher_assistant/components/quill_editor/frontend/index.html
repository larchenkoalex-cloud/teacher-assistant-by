<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Editor</title>

    <link href="vendor/quill.snow.css" rel="stylesheet" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #editor {
        flex: 1;
        overflow: auto;
      }

      /* custom context menu removed - use browser default context menu */

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script src="vendor/quill.min.js"></script>
    <script src="vendor/streamlit-component-lib.js"></script>
  </head>

  <body>
    <div id="root">
      <div id="editor"></div>
    </div>

    <!-- custom context menu removed -->

    <script type="module">
      // Prefer the official Streamlit component runtime to stay compatible with Streamlit Cloud.
      // If it can't be loaded (CSP/network), fall back to the bundled legacy runtime.
      let Streamlit = null;
      try {
        const mod = await import("https://unpkg.com/streamlit-component-lib@2.0.0/dist/streamlit.js");
        Streamlit = mod.Streamlit;
        window.Streamlit = Streamlit;
        window.streamlitComponentLib = { Streamlit };
      } catch (e) {
        Streamlit = window.Streamlit || (window.streamlitComponentLib && window.streamlitComponentLib.Streamlit) || null;
      }

      let quill = null;
      let lastHtml = "";
      let lastSelection = null;
      let suppressEmit = false;
      let lastSelectionRequestUid = null;

      // custom context menu removed; no show/hide functions

      function getSelectionSafe() {
        if (!quill) return null;
        try {
          // `true` заставляет Quill сфокусироваться перед чтением выделения.
          // Это критично для сценария ПКМ/контекстного меню: иначе Quill
          // иногда возвращает null, и действие приходится повторять.
          return quill.getSelection(true) || quill.getSelection();
        } catch (e) {
          return null;
        }
      }

      function selectionText(range) {
        if (!quill || !range || !range.length) return "";
        try {
          return quill.getText(range.index, range.length);
        } catch (e) {
          return "";
        }
      }

      function emitContent() {
        if (!quill) return;
        if (suppressEmit) return;
        const html = quill.root.innerHTML;
        lastHtml = html;
        Streamlit.setComponentValue({ type: "content", html });
      }

      function emitDebug(msg, data) {
        // ВАЖНО: Streamlit компонент может отправить только ОДНО значение за раз.
        // Debug-сообщения через setComponentValue легко "перетирают" content-события,
        // из-за чего замена видна только после следующего клика/ПКМ.
        // Поэтому debug оставляем в консоль.
        try {
          console.debug("[quill_editor]", String(msg || ""), data || {});
        } catch (e) {
          // swallow
        }
      }

      function applyReplace(payload) {
        if (!quill || !payload) return;
        try {
          if (payload && payload.range && payload.text !== undefined) {
            quill.deleteText(payload.range.index, payload.range.length, "user");
            quill.insertText(payload.range.index, payload.text, "user");

            // 🔥 ОБЯЗАТЕЛЬНО отправляем обновлённый HTML назад
            try {
              Streamlit.setComponentValue({
                type: "content",
                html: quill.root.innerHTML,
              });
            } catch (e) {
              emitDebug("apply_send_content_error", { error: String(e) });
            }
          } else {
            emitDebug("apply_invalid_payload", { payload });
          }
        } catch (e) {
          emitDebug("apply_exception", { error: String(e), payload });
        }
      }

      function initQuill(placeholder) {
        quill = new Quill("#editor", {
          theme: "snow",
          placeholder: placeholder || "",
          modules: {
            toolbar: [
              [{ header: [1, 2, 3, false] }],
              ["bold", "italic", "underline", "strike"],
              [{ list: "ordered" }, { list: "bullet" }],
              [{ align: [] }],
              ["link"],
              ["clean"],
            ],
          },
        });

        quill.on("text-change", function () {
          emitContent();
        });

        quill.on("selection-change", function (range) {
          // Важно: при потере фокуса Quill может прислать range=null.
          // Не затираем последнее валидное выделение, чтобы команда из контекстного
          // меню работала с первого раза.
          if (range) {
            lastSelection = range;
          }
        });

        // Дополнительно фиксируем выделение после завершения мышиного выделения.
        // Иногда right-click происходит уже после blur/selection-change(null).
        quill.root.addEventListener("mouseup", function () {
          setTimeout(function () {
            const r = getSelectionSafe();
            if (r) lastSelection = r;
          }, 0);
        });

        // Custom context menu removed; normal browser context menu will be used.
      }

      function setEditorHeight(height) {
        const editorEl = document.getElementById("editor");
        editorEl.style.height = `${height}px`;
      }

      function onRender(event) {
        const data = event.detail.args || {};
        const height = data.height || 420;
        const placeholder = data.placeholder || "";

        if (!quill) {
          initQuill(placeholder);
        }

        setEditorHeight(height);

        const incomingHtml = data.value || "";
        if (incomingHtml !== lastHtml) {
          // Важно: обновляем содержимое через clipboard API, иначе Quill может "съесть" HTML
          // или потерять внутреннее состояние.
          const range = getSelectionSafe();
          suppressEmit = true;
          try {
            quill.setContents([], "silent");
            quill.clipboard.dangerouslyPasteHTML(0, incomingHtml, "silent");
          } catch (e) {
            // fallback (на всякий случай)
            try {
              quill.root.innerHTML = incomingHtml;
            } catch (ee) {
              emitDebug("paste_error", { error: String(ee), incomingLen: (incomingHtml || "").length });
            }
          }
          suppressEmit = false;
          lastHtml = incomingHtml;
          if (range) {
            try {
              quill.setSelection(range.index, range.length, "silent");
            } catch (e) {}
          }
        }

        if (data.applyReplace && typeof data.applyReplace === "object") {
          try {
            applyReplace(data.applyReplace);
          } catch (e) {
            emitDebug("apply_error", { error: String(e), payload: data.applyReplace });
          }
        }

        // One-shot selection request from Python (for button-driven UX)
        if (data.requestSelection && typeof data.requestSelection === "object") {
          const uidRaw = data.requestSelection._uid;
          const uid = uidRaw === undefined || uidRaw === null ? "" : String(uidRaw);
          if (uid && uid !== lastSelectionRequestUid) {
            lastSelectionRequestUid = uid;
            // Важно: пользователь нажимает кнопку вне iframe, из-за чего фокус может уйти.
            // Берём сохранённое выделение в приоритете.
            const range = lastSelection || getSelectionSafe();
            if (range) lastSelection = range;
            const text = range && range.length ? selectionText(range) : "";
            Streamlit.setComponentValue({
              type: "selection",
              id: Date.now(),
              request_uid: uid,
              range: range ? { index: range.index, length: range.length } : null,
              text,
            });
          }
        }

        Streamlit.setFrameHeight(height + 50);
      }

      function initStreamlitBindings() {
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        try {
          Streamlit.setComponentReady();
        } catch (e) {}
        try {
          Streamlit.setFrameHeight(500);
        } catch (e) {}
      }

      initStreamlitBindings();
    </script>
  </body>
</html>
