<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Editor</title>

    <link href="vendor/quill.snow.css" rel="stylesheet" />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #editor {
        flex: 1;
        overflow: auto;
      }

      .context-menu {
        position: fixed;
        z-index: 9999;
        display: none;
        min-width: 240px;
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 6px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        color: #fff;
      }

      .context-menu button {
        width: 100%;
        appearance: none;
        background: transparent;
        border: 0;
        color: #fff;
        padding: 10px 10px;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        border-radius: 8px;
      }

      .context-menu button:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .context-menu .hint {
        margin: 6px 10px 8px 10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
      }

      .context-menu .disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script src="vendor/quill.min.js"></script>
    <script src="vendor/streamlit-component-lib.js"></script>
  </head>

  <body>
    <div id="root">
      <div id="editor"></div>
    </div>

    <div id="menu" class="context-menu" role="menu" aria-label="Меню редактора">
      <button id="replaceBtn" type="button" role="menuitem">
        Заменить на другой вариант (AI)
      </button>
      <div class="hint" id="selectionHint">Выделите текст и нажмите ПКМ</div>
    </div>

    <script>
      // Streamlit runtime is provided by vendor/streamlit-component-lib.js

      // Resolve Streamlit API.
      function resolveStreamlit() {
        return window.Streamlit || (window.streamlitComponentLib && window.streamlitComponentLib.Streamlit) || null;
      }

      let Streamlit = resolveStreamlit();

      let quill = null;
      let lastHtml = "";
      let lastSelection = null;
      let menuOpen = false;
      let replaceRequestId = 0;
      let suppressEmit = false;

      function hideMenu() {
        const menu = document.getElementById("menu");
        menu.style.display = "none";
        menuOpen = false;
      }

      function showMenu(x, y) {
        const menu = document.getElementById("menu");
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;
        menu.style.display = "block";
        menuOpen = true;
      }

      function getSelectionSafe() {
        if (!quill) return null;
        try {
          // `true` заставляет Quill сфокусироваться перед чтением выделения.
          // Это критично для сценария ПКМ/контекстного меню: иначе Quill
          // иногда возвращает null, и действие приходится повторять.
          return quill.getSelection(true) || quill.getSelection();
        } catch (e) {
          return null;
        }
      }

      function selectionText(range) {
        if (!quill || !range || !range.length) return "";
        try {
          return quill.getText(range.index, range.length);
        } catch (e) {
          return "";
        }
      }

      function emitContent() {
        if (!quill) return;
        if (suppressEmit) return;
        const html = quill.root.innerHTML;
        lastHtml = html;
        Streamlit.setComponentValue({ type: "content", html });
      }

      function emitDebug(msg, data) {
        try {
          const payload = { type: "debug", msg: String(msg || ""), data: data || {} };
          Streamlit.setComponentValue(payload);
        } catch (e) {
          // swallow
        }
      }

      function applyReplace(payload) {
        if (!quill || !payload) return;
        const { range, text } = payload;
        if (!range || typeof range.index !== "number" || typeof range.length !== "number") {
          emitDebug("apply_invalid_range", { payload });
          return;
        }
        const insertText = String(text ?? "");
        try {
          quill.focus();
          quill.deleteText(range.index, range.length, "user");
          quill.insertText(range.index, insertText, "user");
          // После вставки выделяем новый текст, чтобы можно было сразу повторить замену.
          quill.setSelection(range.index, insertText.length, "user");
          lastSelection = { index: range.index, length: insertText.length };
          emitDebug("apply_performed", { index: range.index, length: insertText.length, id: payload.id });
          // Отправим ACK немедленно, чтобы сервер мог подтвердить применение раньше
          // возможной отложенной отправки контента.
          try {
            Streamlit.setComponentValue({ type: "apply_ack", id: payload.id });
            emitDebug("apply_ack_sent_inside_apply", { id: payload.id });
          } catch (ackErr) {
            emitDebug("apply_ack_error_inside_apply", { error: String(ackErr) });
          }
          // Отложенно отправим контент вне текущего стека вызовов, чтобы гарантировать
          // его доставку клиенту сервера.
          setTimeout(function () {
            try {
              emitContent();
              emitDebug("apply_content_emitted_delayed", { id: payload.id });
            } catch (e) {
              emitDebug("apply_content_emit_error", { error: String(e), id: payload.id });
            }
          }, 50);
        } catch (e) {
          emitDebug("apply_exception", { error: String(e), payload });
        }
      }

      function initQuill(placeholder) {
        quill = new Quill("#editor", {
          theme: "snow",
          placeholder: placeholder || "",
          modules: {
            toolbar: [
              [{ header: [1, 2, 3, false] }],
              ["bold", "italic", "underline", "strike"],
              [{ list: "ordered" }, { list: "bullet" }],
              [{ align: [] }],
              ["link"],
              ["clean"],
            ],
          },
        });

        quill.on("text-change", function () {
          emitContent();
        });

        quill.on("selection-change", function (range) {
          // Важно: при потере фокуса Quill может прислать range=null.
          // Не затираем последнее валидное выделение, чтобы команда из контекстного
          // меню работала с первого раза.
          if (range) {
            lastSelection = range;
          }
        });

        // Дополнительно фиксируем выделение после завершения мышиного выделения.
        // Иногда right-click происходит уже после blur/selection-change(null).
        quill.root.addEventListener("mouseup", function () {
          setTimeout(function () {
            const r = getSelectionSafe();
            if (r) lastSelection = r;
          }, 0);
        });

        // Не даём клику по меню увести фокус и сбросить выделение.
        const menuEl = document.getElementById("menu");
        menuEl.addEventListener("mousedown", function (e) {
          e.preventDefault();
        });

        // Right-click handler
        quill.root.addEventListener("contextmenu", function (evt) {
          evt.preventDefault();
          evt.stopPropagation();
          // Попробуем получить выделение с фокусом.
          const range = getSelectionSafe() || lastSelection;
          if (range) lastSelection = range;

          const btn = document.getElementById("replaceBtn");
          const hint = document.getElementById("selectionHint");

          if (!range || !range.length) {
            btn.classList.add("disabled");
            hint.textContent = "Выделите текст, затем ПКМ";
          } else {
            btn.classList.remove("disabled");
            hint.textContent = `Выделено: ${Math.min(range.length, 120)} символов`;
          }

          showMenu(evt.clientX, evt.clientY);
        });

        document.addEventListener("click", function () {
          if (menuOpen) hideMenu();
        });

        document.addEventListener("scroll", function () {
          if (menuOpen) hideMenu();
        });

        document.addEventListener("keydown", function (evt) {
          if (evt.key === "Escape" && menuOpen) hideMenu();
        });

        document.getElementById("replaceBtn").addEventListener("click", function (evt) {
          // Клик по меню может увести фокус и обнулить текущее выделение.
          // Поэтому используем сохранённый `lastSelection`.
          if (evt) {
            evt.preventDefault();
            evt.stopPropagation();
          }
          const range = getSelectionSafe() || lastSelection;
          if (!range || !range.length) return;

          const text = selectionText(range);
          replaceRequestId += 1;
          Streamlit.setComponentValue({
            type: "replace_request",
            id: replaceRequestId,
            range: { index: range.index, length: range.length },
            text,
          });
          hideMenu();
        });
      }

      function setEditorHeight(height) {
        const editorEl = document.getElementById("editor");
        editorEl.style.height = `${height}px`;
      }

      function onRender(event) {
        const data = event.detail.args || {};
        const height = data.height || 420;
        const placeholder = data.placeholder || "";

        if (!quill) {
          initQuill(placeholder);
        }

        setEditorHeight(height);

        const incomingHtml = data.value || "";
        if (incomingHtml !== lastHtml) {
          // Важно: обновляем содержимое через clipboard API, иначе Quill может "съесть" HTML
          // или потерять внутреннее состояние.
          const range = getSelectionSafe();
          suppressEmit = true;
          try {
            quill.setContents([], "silent");
            quill.clipboard.dangerouslyPasteHTML(0, incomingHtml, "silent");
            // Отправим краткую отладочную метрику в Streamlit
            emitDebug("paste_success", { incomingLen: (incomingHtml || "").length, afterLen: quill.root.innerHTML.length });
          } catch (e) {
            // fallback (на всякий случай)
            try {
              quill.root.innerHTML = incomingHtml;
              emitDebug("paste_fallback_success", { incomingLen: (incomingHtml || "").length, afterLen: quill.root.innerHTML.length });
            } catch (ee) {
              emitDebug("paste_error", { error: String(ee), incomingLen: (incomingHtml || "").length });
            }
          }
          suppressEmit = false;
          lastHtml = incomingHtml;
          if (range) {
            try {
              quill.setSelection(range.index, range.length, "silent");
            } catch (e) {}
          }
        }

        if (data.applyReplace && typeof data.applyReplace === "object") {
          emitDebug("apply_received", data.applyReplace);
          try {
            applyReplace(data.applyReplace);
            emitDebug("apply_attempted", { id: data.applyReplace.id });
            // Отправим немедленный ACK, чтобы сервер мог подтвердить применение даже
            // если контентное сообщение придёт позже или будет отфильтровано.
            try {
              Streamlit.setComponentValue({ type: "apply_ack", id: data.applyReplace.id });
              emitDebug("apply_ack_sent", { id: data.applyReplace.id });
            } catch (ackErr) {
              emitDebug("apply_ack_error", { error: String(ackErr) });
            }
          } catch (e) {
            emitDebug("apply_error", { error: String(e), payload: data.applyReplace });
          }
        }

        Streamlit.setFrameHeight(height + 50);
      }

      function initStreamlitBindings() {
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        try {
          Streamlit.setComponentReady();
        } catch (e) {}
        try {
          Streamlit.setFrameHeight(500);
        } catch (e) {}
      }

      if (Streamlit) {
        initStreamlitBindings();
      } else {
        console.error("Streamlit runtime not found. Did vendor/streamlit-component-lib.js load?");
      }
    </script>
  </body>
</html>
